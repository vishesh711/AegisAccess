<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Targeted rules cut false alarms from 10 to 2 and miss one more attack">
