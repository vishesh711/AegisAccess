name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - name: ruff, format, mypy, opa fmt/check
        run: make lint
      - name: Rego policy tests
        run: make policy-test
      - name: Unit tests (no services)
        run: make unit
      - name: Dependency vulnerability scan (hash-pinned lockfile)
        run: make audit-deps

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - name: Start stack (keycloak, postgres, opa, api, mcp-server, audit-sink, audit-shipper)
        run: make up
      - run: make migrate seed
      - name: Unit + integration + security tests against real Keycloak/OPA/PostgreSQL
        run: make test
      - name: Attack corpus with side-effect checks + report (fails on any unauthorized side effect)
        run: make security-test
      - run: make sql-eval
      - name: Demo (its last step ships and verifies the audit trail of the demo run)
        run: make demo
      - name: External audit store + reconciliation (whole store vs DB; activity since the demo began)
        run: make audit-ship audit-verify SINCE="$(cat artifacts/tmp/demo-started-at)"
      - name: Container image scan - fail on fixable CRITICAL
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
          image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress aegisaccess-app:local
      - name: Container image scan - HIGH findings (report only)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
          image --severity HIGH --exit-code 0 --no-progress aegisaccess-app:local
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            artifacts/security-test-report.md
            artifacts/verification/sql-eval.md
            artifacts/tmp/scenarios.json
            artifacts/tmp/audit-verify.json
      - name: Compose logs on failure
        if: failure()
        run: make logs
      - if: always()
        run: make down

  hardened:
    # Hardened profile (ADR-9): HTTPS-only Keycloak on PostgreSQL, PKCE logins, mutual TLS to OPA.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - name: Start hardened stack (generates a throwaway local CA)
        run: make up-hardened
      - run: make migrate seed-hardened
      - name: Transport, PKCE and mTLS checks, plus allow/deny/agent run through them
        run: make hardened-test
      - name: Compose logs on failure
        if: failure()
        run: make logs
      - if: always()
        run: make down

