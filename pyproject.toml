[project]
name = "aegisaccess"
version = "0.1.0"
description = "Zero-trust IAM and AI-agent tool authorization demo (local, synthetic data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pyjwt[crypto]==2.15.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis", "apps/api/aegis_api", "apps/mcp_server/aegis_mcp"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "apps/api", "apps/mcp_server", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607"]
"scripts/**" = ["S603", "S607", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "apps/api", "apps/mcp_server"]
packages = ["aegis", "aegis_api", "aegis_mcp"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the compose stack (keycloak, postgres, opa)",
    "security: mandatory attack scenario",
]
addopts = "-ra --strict-markers"
